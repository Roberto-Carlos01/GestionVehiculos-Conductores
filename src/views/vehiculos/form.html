<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registrar Vehículo</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: linear-gradient(to right, #f1f5f9, #dbeafe);
        min-height: 100vh;
      }

      .vehicle-card {
        border: none;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
      }

      .card-header {
        padding: 25px;
      }

      .form-control {
        border-radius: 14px;
        padding: 12px;
      }

      .form-control:focus {
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
      }

      .input-group-text {
        border-radius: 14px 0 0 14px;
      }

      .btn {
        border-radius: 14px;
        padding: 12px;
        font-weight: bold;
      }

      .info-box {
        border-radius: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card vehicle-card">
            <!-- Header -->
            <div class="card-header bg-dark text-white text-center">
              <h2 class="mb-2">🚗 Registro de Vehículos</h2>

              <p class="mb-0">Complete los datos del vehículo</p>
            </div>

            <!-- Body -->
            <div class="card-body p-4">
              <div class="alert alert-primary info-box">
                <i class="bi bi-info-circle-fill"></i>

                El vehículo será asociado automáticamente al conductor mediante
                el CI.
              </div>

              <form action="/vehiculos/nuevo" method="POST">
                <!-- CI -->
                <div class="mb-3">
                  <label class="form-label fw-bold">
                    🪪 CI del Conductor
                  </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-person-vcard"></i>
                    </span>

                    <input
                      type="text"
                      name="ci"
                      class="form-control"
                      placeholder="Ingrese el CI del conductor"
                      required
                    />
                  </div>
                </div>

                <!-- Placa -->
                <div class="mb-3">
                  <label class="form-label fw-bold"> 🔖 Placa </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-upc-scan"></i>
                    </span>

                    <input
                      type="text"
                      name="placa"
                      class="form-control"
                      placeholder="Ej: 4587-ABC"
                      required
                    />
                  </div>
                </div>

                <!-- Marca -->
                <div class="mb-3">
                  <label class="form-label fw-bold"> 🚘 Marca </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-car-front-fill"></i>
                    </span>

                    <input
                      type="text"
                      name="marca"
                      class="form-control"
                      placeholder="Ej: Toyota"
                      required
                    />
                  </div>
                </div>

                <!-- Modelo -->
                <div class="mb-3">
                  <label class="form-label fw-bold"> 🛞 Modelo </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-car-front"></i>
                    </span>

                    <input
                      type="text"
                      name="modelo"
                      class="form-control"
                      placeholder="Ej: Corolla"
                      required
                    />
                  </div>
                </div>

                <!-- Año -->
                <div class="mb-3">
                  <label class="form-label fw-bold"> 📅 Año </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-calendar-event"></i>
                    </span>

                    <input
                      type="number"
                      name="anio"
                      class="form-control"
                      placeholder="Ej: 2020"
                      min="1950"
                      max="2035"
                      required
                    />
                  </div>
                </div>

                <!-- Color -->
                <div class="mb-4">
                  <label class="form-label fw-bold"> 🎨 Color </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-palette-fill"></i>
                    </span>

                    <input
                      type="text"
                      name="color"
                      class="form-control"
                      placeholder="Ej: Blanco"
                      required
                    />
                  </div>
                </div>

                <!-- Alert -->
                <div class="alert alert-warning info-box">
                  <i class="bi bi-exclamation-triangle-fill"></i>

                  Asegúrese de ingresar correctamente el CI del conductor antes
                  de registrar.
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-3 mt-4">
                  <button type="submit" class="btn btn-dark w-100">
                    <i class="bi bi-save"></i>
                    Registrar Vehículo
                  </button>

                  <a href="/" class="btn btn-secondary w-100">
                    <i class="bi bi-arrow-left"></i>
                    Volver
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
