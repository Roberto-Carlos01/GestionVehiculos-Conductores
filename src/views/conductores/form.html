<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Conductores</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: linear-gradient(to right, #e0f2fe, #f8fafc);
        min-height: 100vh;
      }

      .driver-card {
        border: none;
        border-radius: 25px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .card-header {
        padding: 25px;
      }

      .form-control {
        border-radius: 14px;
        padding: 12px;
      }

      .form-control:focus {
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
      }

      .btn {
        border-radius: 14px;
        padding: 12px;
        font-weight: bold;
      }

      .info-box {
        border-radius: 15px;
      }

      .input-group-text {
        border-radius: 14px 0 0 14px;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card driver-card">
            <!-- Header -->
            <div class="card-header bg-primary text-white text-center">
              <h2 class="mb-2">{{TITULO}}</h2>

              <p class="mb-0">Complete la información del conductor</p>
            </div>

            <!-- Body -->
            <div class="card-body p-4">
              <div class="alert alert-info info-box">
                <i class="bi bi-info-circle-fill"></i>

                Todos los campos son obligatorios para registrar al conductor.
              </div>

              <form action="{{ACTION}}" method="POST">
                <input type="hidden" name="id" value="{{ID}}" />
                <!-- CI -->
                <div class="mb-3">
                  <label class="form-label fw-bold">
                    🪪 Carnet de Identidad
                  </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-person-vcard"></i>
                    </span>

                    <input
                      type="text"
                      name="ci"
                      class="form-control"
                      placeholder="Ingrese el CI"
                      value="{{CI}}"
                      required
                    />
                  </div>
                </div>

                <!-- Nombres -->
                <div class="mb-3">
                  <label class="form-label fw-bold"> 👤 Nombres </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-person"></i>
                    </span>

                    <input
                      type="text"
                      name="nombres"
                      class="form-control"
                      placeholder="Ingrese los nombres"
                      value="{{NOMBRES}}"
                      required
                    />
                  </div>
                </div>

                <!-- Apellidos -->
                <div class="mb-3">
                  <label class="form-label fw-bold"> 👥 Apellidos </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-person-badge"></i>
                    </span>

                    <input
                      type="text"
                      name="apellidos"
                      class="form-control"
                      value="{{APELLIDOS}}"
                      placeholder="Ingrese los apellidos"
                      required
                    />
                  </div>
                </div>

                <!-- Fecha -->
                <div class="mb-3">
                  <label class="form-label fw-bold">
                    🎂 Fecha de Nacimiento
                  </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-calendar-date"></i>
                    </span>

                    <input
                      type="date"
                      name="fecha_nacimiento"
                      value="{{FECHA_NACIMIENTO}}"
                      class="form-control"
                      required
                    />
                  </div>
                </div>

                <!-- Dirección -->
                <div class="mb-3">
                  <label class="form-label fw-bold"> 🏠 Dirección </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-geo-alt"></i>
                    </span>

                    <input
                      type="text"
                      name="direccion"
                      class="form-control"
                      placeholder="Ingrese la dirección"
                      value="{{DIRECCION}}"
                      required
                    />
                  </div>
                </div>

                <!-- Teléfono -->
                <div class="mb-4">
                  <label class="form-label fw-bold"> 📞 Teléfono </label>

                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="bi bi-telephone"></i>
                    </span>

                    <input
                      type="tel"
                      name="telefono"
                      class="form-control"
                      value="{{TELEFONO}}"
                      placeholder="Ingrese el teléfono"
                      required
                    />
                  </div>
                </div>

                <!-- Alert -->
                <div class="alert alert-warning info-box">
                  <i class="bi bi-exclamation-triangle-fill"></i>

                  Verifique correctamente la información antes de confirmar.
                </div>

                <!-- Botones -->
                <div class="d-flex gap-3 mt-4">
                  <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-save"></i>
                    {{BOTON}}
                  </button>

                  <a href="/" class="btn btn-secondary w-100">
                    <i class="bi bi-arrow-left"></i>
                    Volver
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
