<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Conductores y Vehículos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding: 30px;
        background-color: #f8f9fa;
      }
      .nav-tabs .nav-link {
        font-weight: 500;
      }
      .card {
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mb-4">🚗 Gestión de Conductores y Vehículos</h1>

      <!-- Pestañas -->
      <ul class="nav nav-tabs mb-4" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="conductores-tab"
            data-bs-toggle="tab"
            data-bs-target="#conductores"
            type="button"
          >
            Conductores
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="vehiculos-tab"
            data-bs-toggle="tab"
            data-bs-target="#vehiculos"
            type="button"
          >
            Vehículos
          </button>
        </li>
      </ul>

      <div class="tab-content" id="myTabContent">
        <!-- ====================== TAB CONDUCTORES ====================== -->
        <div class="tab-pane fade show active" id="conductores">
          <h3>Conductores</h3>
          <div id="lista-conductores">
            <!-- Aquí se inyecta la lista de conductores con JS -->
          </div>
          <hr />
          <a href="/conductores/nuevo" class="btn btn-primary"
            >+ Nuevo Conductor</a
          >
        </div>

        <!-- ====================== TAB VEHICULOS ====================== -->
        <div class="tab-pane fade" id="vehiculos">
          <h3>Vehículos</h3>
          <div id="lista-vehiculos">
            <!-- Aquí se inyecta la lista de vehículos -->
          </div>
          <hr />
          <a href="/vehiculos/nuevo" class="btn btn-primary"
            >+ Nuevo Vehículo</a
          >
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
