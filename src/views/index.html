<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Gestión de Conductores y Vehículos</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: linear-gradient(to right, #eef2ff, #f8fafc);
        min-height: 100vh;
        padding: 30px 0;
      }

      .main-card {
        border: none;
        border-radius: 30px;
        overflow: hidden;
        box-shadow:
          0 20px 45px rgba(0, 0, 0, 0.08),
          0 5px 15px rgba(13, 110, 253, 0.05);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
      }

      .header-section {
        background: linear-gradient(135deg, #0d6efd, #2563eb);
        padding: 50px 25px;
        color: white;
        position: relative;
        overflow: hidden;
      }

      .header-section::before {
        content: "";
        position: absolute;
        width: 350px;
        height: 350px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        top: -150px;
        right: -120px;
      }

      .header-section h1 {
        font-weight: 800;
        letter-spacing: 0.5px;
        position: relative;
        z-index: 2;
      }

      .header-section p {
        opacity: 0.9;
        position: relative;
        z-index: 2;
        font-size: 1.05rem;
      }

      .nav-tabs {
        border-bottom: none;
        gap: 12px;
      }

      .nav-tabs .nav-link {
        border: none;
        border-radius: 16px;
        padding: 13px 24px;
        font-weight: 600;
        color: #495057;
        transition: all 0.25s ease;
        background: #f8fafc;
      }

      .nav-tabs .nav-link:hover {
        transform: translateY(-2px);
        background: #e9ecef;
      }

      .nav-tabs .nav-link.active {
        background: linear-gradient(to right, #0d6efd, #2563eb);
        color: white;
        box-shadow: 0 10px 25px rgba(13, 110, 253, 0.25);
      }

      .section-title {
        font-weight: 800;
        color: #212529;
        letter-spacing: 0.3px;
      }

      .custom-btn {
        border-radius: 16px;
        padding: 13px 22px;
        font-weight: 700;
        transition: all 0.25s ease;
        border: none;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .custom-btn:hover {
        transform: translateY(-3px) scale(1.01);
      }

      .content-box {
        background: rgba(255, 255, 255, 0.85);
        border-radius: 28px;
        padding: 30px;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.04),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(12px);
      }

      /* ========================================= */
      /* TARJETAS DE LISTAS */
      /* ========================================= */

      #lista-conductores .card,
      #lista-vehiculos .card {
        border: none;
        border-radius: 24px;
        overflow: hidden;
        transition: all 0.3s ease;
        background: white;
        box-shadow:
          0 10px 25px rgba(0, 0, 0, 0.06),
          0 3px 8px rgba(0, 0, 0, 0.03);
        position: relative;
      }

      #lista-conductores .card::before,
      #lista-vehiculos .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 6px;
        background: linear-gradient(to right, #0d6efd, #2563eb);
      }

      #lista-vehiculos .card::before {
        background: linear-gradient(to right, #111827, #374151);
      }

      #lista-conductores .card:hover,
      #lista-vehiculos .card:hover {
        transform: translateY(-8px);
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.08),
          0 8px 18px rgba(13, 110, 253, 0.08);
      }

      /* BODY DE TARJETAS */

      #lista-conductores .card-body,
      #lista-vehiculos .card-body {
        padding: 25px;
      }

      /* TITULOS */

      #lista-conductores .card-title,
      #lista-vehiculos .card-title {
        font-weight: 800;
        color: #1e293b;
        margin-bottom: 15px;
        font-size: 1.2rem;
      }

      /* TEXTO */

      #lista-conductores .card-text,
      #lista-vehiculos .card-text {
        color: #475569;
        line-height: 1.8;
      }

      /* BADGES */

      .custom-badge {
        background: #eff6ff;
        color: #2563eb;
        border-radius: 12px;
        padding: 7px 12px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      /* BOTONES */

      .card .btn {
        border-radius: 14px;
        padding: 10px 16px;
        font-weight: 600;
        transition: 0.25s ease;
      }

      .card .btn:hover {
        transform: scale(1.03);
      }

      .divider {
        border-top: 1px solid #e2e8f0;
        margin-top: 30px;
      }

      /* SCROLL SUAVE */

      html {
        scroll-behavior: smooth;
      }

      /* RESPONSIVE */

      @media (max-width: 768px) {
        .header-section {
          padding: 35px 20px;
        }

        .header-section h1 {
          font-size: 1.9rem;
        }

        .nav-tabs {
          flex-direction: column;
        }

        .nav-tabs .nav-link {
          width: 100%;
          text-align: center;
        }

        .content-box {
          padding: 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- CARD PRINCIPAL -->
      <div class="card main-card">
        <!-- HEADER -->
        <div class="header-section text-center">
          <h1>🚗 Gestión de Conductores y Vehículos</h1>

          <p class="mb-0 mt-2">
            Administra conductores y vehículos de manera rápida y organizada
          </p>
        </div>

        <!-- BODY -->
        <div class="card-body p-4 p-md-5">
          <!-- TABS -->
          <ul
            class="nav nav-tabs justify-content-center mb-5"
            id="myTab"
            role="tablist"
          >
            <!-- Conductores -->
            <li class="nav-item" role="presentation">
              <button
                class="nav-link active"
                id="conductores-tab"
                data-bs-toggle="tab"
                data-bs-target="#conductores"
                type="button"
              >
                <i class="bi bi-people-fill"></i>
                Conductores
              </button>
            </li>

            <!-- Vehículos -->
            <li class="nav-item" role="presentation">
              <button
                class="nav-link"
                id="vehiculos-tab"
                data-bs-toggle="tab"
                data-bs-target="#vehiculos"
                type="button"
              >
                <i class="bi bi-car-front-fill"></i>
                Vehículos
              </button>
            </li>
          </ul>

          <!-- CONTENIDO -->
          <div class="tab-content" id="myTabContent">
            <!-- ===================================== -->
            <!-- TAB CONDUCTORES -->
            <!-- ===================================== -->

            <div class="tab-pane fade show active" id="conductores">
              <div class="content-box">
                <!-- HEADER -->
                <div
                  class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
                >
                  <div>
                    <h2 class="section-title mb-1">👨‍✈️ Conductores</h2>

                    <p class="text-muted mb-0">
                      Lista y administración de conductores registrados
                    </p>
                  </div>

                  <a
                    href="/conductores/nuevo"
                    class="btn btn-primary custom-btn"
                  >
                    <i class="bi bi-plus-circle-fill"></i>
                    Nuevo Conductor
                  </a>
                </div>

                <!-- LISTA -->
                <div id="lista-conductores">
                  <!-- Aquí se inyecta la lista -->
                </div>

                <div class="divider"></div>
              </div>
            </div>

            <!-- ===================================== -->
            <!-- TAB VEHÍCULOS -->
            <!-- ===================================== -->

            <div class="tab-pane fade" id="vehiculos">
              <div class="content-box">
                <!-- HEADER -->
                <div
                  class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4"
                >
                  <div>
                    <h2 class="section-title mb-1">🚘 Vehículos</h2>

                    <p class="text-muted mb-0">
                      Lista y administración de vehículos registrados
                    </p>
                  </div>

                  <a href="/vehiculos/nuevo" class="btn btn-dark custom-btn">
                    <i class="bi bi-plus-circle-fill"></i>
                    Nuevo Vehículo
                  </a>
                </div>

                <!-- LISTA -->
                <div id="lista-vehiculos">
                  <!-- Aquí se inyecta la lista -->
                </div>

                <div class="divider"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
